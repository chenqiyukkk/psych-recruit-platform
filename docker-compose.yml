version: "3.8"

services:
  # ==========================================
  # 1. MySQL 数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: psych_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: psych_recruit_platform
      TZ: Asia/Shanghai
    # 3306 仅内网访问，不暴露到公网
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建表
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. Spring Boot 后端
  # ==========================================
  backend:
    build:
      context: ./backend
    container_name: psych_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/psych_recruit_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-please-change-this-jwt-secret-to-32-chars-minimum}
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID:-}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET:-}
    # 仅内部通信；调试时可临时打开
    # ports:
    #   - "8080:8080"

  # ==========================================
  # 3. Nginx + Vue 前端
  # ==========================================
  frontend:
    build:
      context: ./frontend
    container_name: psych_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
